 const panel=document.querySelector('.scene-panel'),canvas=document.querySelector('.canvas');
 // Fit the full diagram inside both available dimensions, keeping its aspect ratio.
 const scene=$('scene'),camera=createCamera(),pointers=new Map();let gesture=null;
 function updateHitTargets(){
  const scale=scene.getScreenCTM()?.a;if(!scale)return;
  const carTarget=scene.querySelector('[data-drag="car"]'),eyeTarget=scene.querySelector('[data-drag="observer"]');
  if(carTarget){const w=Math.max(86,44/scale),h=Math.max(66,44/scale);carTarget.setAttribute('x',state.car-w/2);carTarget.setAttribute('y',313-h/2);carTarget.setAttribute('width',w);carTarget.setAttribute('height',h)}
  if(eyeTarget)eyeTarget.setAttribute('r',Math.max(35,22/scale));

 function pos(ev){const p=scene.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(scene.getScreenCTM().inverse())}

 function beginPinch(){

  gesture={type:'pinch',ids:entries.map(e=>e[0]),distance:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),zoom:camera.zoom,anchor:{x:camera.x+mid.x*760/camera.zoom,y:camera.y+mid.y*600/camera.zoom}};
  scene.classList.remove('dragging');scene.classList.add('panning');
 }
 function clearPointers(){
  const ids=[...pointers.keys()];pointers.clear();gesture=null;scene.classList.remove('dragging','panning');

  if(ev.pointerType==='mouse'&&ev.button!==0&&ev.button!==1)return;

   const a=pointers.get(gesture.ids[0]),b=pointers.get(gesture.ids[1]);if(!a||!b)return;

  }
